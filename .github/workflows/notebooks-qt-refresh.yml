name: Refresh frozen-Qt notebook screenshots
# Manual-only (workflow_dispatch): this writes real Qt MetalGUI screenshots
# back into the frozen-Qt tutorial notebooks (see
# _dev/notebooks-frozen-qt.txt), replacing the hand-curated ones. Never runs
# on push/PR -- it must not silently clobber a maintainer's curated
# screenshots as a side effect of an unrelated change.
#
# This is "Option E" from _dev/notebooks-frozen-qt.txt's deferred-work note:
# an Xvfb-backed auto-refresh, opted into per-run rather than always-on. The
# trade-off documented there still applies -- Xvfb's default dock/window
# layout is functional but visually plainer than a maintainer's hand-arranged
# JupyterLab session. Review the diff before merging; this workflow uploads
# an artifact, it does not commit or open a PR by itself.
#
# Requires: _dev/rerun_auto.py's --write-frozen flag (see that file's
# docstring) and docs/architecture/gui_crash_defenses.md read first if you
# are touching anything this workflow depends on -- MetalGUI startup/
# stylesheet code is a hard-touch zone.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: >-
          Only refresh notebooks whose path contains this substring
          (e.g. "1-Overview"). Leave blank to refresh all 5 frozen-Qt
          notebooks.
        required: false
        default: ""

jobs:
  refresh-frozen-qt-notebooks:
    name: refresh-frozen-qt-notebooks
    runs-on: ubuntu-24.04
    env:
      FORCE_COLOR: "1"
      QT_QPA_PLATFORM: "xcb"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.24"
          enable-cache: true

      # Same package list as tests-gui-display in main.yml -- PySide6's xcb
      # platform plugin needs these to load and show a window; Xvfb provides
      # the headless X server. Kept in sync manually; if that job's list
      # changes, mirror it here.
      - name: Install Xvfb + Qt runtime libraries
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/google-chrome.list || true
          for i in 1 2 3; do
            sudo timeout 180 apt-get update && break || { echo "apt-get update attempt $i failed"; sleep 5; }
          done
          sudo apt-get install -y \
            xvfb \
            libegl1 libgl1 libglib2.0-0 \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-glx0 libxcb-util1 \
            libfontconfig1 libxrender1 libsm6 libice6 \
            pandoc

      - name: Install with the GUI extra + notebook execution deps
        run: |
          uv venv --python 3.12
          uv pip install -e '.[gui]'
          uv pip install 'jupyter>=1.0' 'nbconvert>=7.0' 'ipykernel>=6.0'
          .venv/bin/python -m ipykernel install --user --name qm_qt_refresh

      - name: Sanity — a raw Qt window shows under Xvfb
        run: |
          xvfb-run -a .venv/bin/python -c "
          from PySide6.QtWidgets import QApplication, QMainWindow
          app = QApplication([]); QMainWindow().show()
          print('OK: raw Qt window shown under Xvfb')
          "

      - name: Refresh frozen-Qt notebook outputs
        env:
          JUPYTER_KERNEL_NAME: qm_qt_refresh
        run: |
          xvfb-run -a .venv/bin/python _dev/rerun_auto.py \
            --run --write-frozen --jobs 1 \
            --filter "${{ inputs.filter }}"

      - name: Show what changed
        run: git status --short docs/tut docs/circuit-examples

      # Deliberately no commit/push/PR step. A human reviews the diff --
      # these are the docs site's most-viewed screenshots, and an
      # auto-refresh silently landing a worse-looking dock layout with no
      # review is a worse outcome than a manual re-run.
      - name: Upload refreshed notebooks as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-frozen-qt-notebooks
          path: |
            docs/tut/**/*.ipynb
            docs/circuit-examples/**/*.ipynb
          retention-days: 14
