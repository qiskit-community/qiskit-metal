<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Design, render, simulate, quantize, Hamiltonian, with a feedback loop to the design and GDS output to fabrication"><title>Design, render, simulate, quantize, Hamiltonian, with a feedback loop to the design and GDS output to fabrication</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2430}
.h{font-size:19px;font-weight:600}.t{font-size:14.5px}.s{font-size:13px;fill:#586175}.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#f3f5fa;stroke:#c3cadb;stroke-width:1.5}
.acc{fill:#e6efff;stroke:#4589ff;stroke-width:2}
.pur{fill:#f0e9ff;stroke:#8a3ffc;stroke-width:2}
.ln{stroke:#586175;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.arr{stroke:#4589ff;stroke-width:2.6;fill:none;marker-end:url(#a)}
.arr2{stroke:#8a3ffc;stroke-width:2.2;fill:none;stroke-dasharray:6 5;marker-end:url(#b)}
.mk{fill:#4589ff}.mk2{fill:#8a3ffc}
.bar{fill:#4589ff}.bar2{fill:#8a3ffc}.bar3{fill:#0e9f8a}.track{fill:#e3e7f0}
.curve{stroke:#4589ff;stroke-width:2.4;fill:none}
.jj{fill:#f0e9ff;stroke:#8a3ffc;stroke-width:2}
@media (prefers-color-scheme:dark){
text{fill:#e4e6ea}.s{fill:#a2abbd}
.box{fill:#1c2028;stroke:#3b4252}.acc{fill:#18294a;stroke:#78a9ff}.pur{fill:#271a45;stroke:#be95ff}
.ln{stroke:#a2abbd}.arr{stroke:#78a9ff}.arr2{stroke:#be95ff}.mk{fill:#78a9ff}.mk2{fill:#be95ff}
.bar{fill:#78a9ff}.bar2{fill:#be95ff}.bar3{fill:#3ddbd9}.track{fill:#2a303c}.curve{stroke:#78a9ff}.jj{fill:#271a45;stroke:#be95ff}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk2" d="M0 0L10 5L0 10z"/></marker></defs><rect class="acc" x="20" y="90" width="166" height="104" rx="14"/><text class="h c" x="103" y="127">Design</text><text class="t c" x="103" y="154">QDesign + QComponents</text><text class="s c" x="103" y="177">layout in Python or GUI</text><path class="arr" d="M190 142H212"/><rect class="box" x="216" y="90" width="166" height="104" rx="14"/><text class="h c" x="299" y="127">Render</text><text class="t c" x="299" y="154">GDS, mesh, Ansys</text><text class="s c" x="299" y="177">one design, many outputs</text><path class="arr" d="M386 142H408"/><rect class="box" x="412" y="90" width="166" height="104" rx="14"/><text class="h c" x="495" y="127">Simulate</text><text class="t c" x="495" y="154">capacitance, modes, S</text><text class="s c" x="495" y="177">open-source or Ansys</text><path class="arr" d="M582 142H604"/><rect class="box" x="608" y="90" width="166" height="104" rx="14"/><text class="h c" x="691" y="127">Quantize</text><text class="t c" x="691" y="154">LOM, EPR, impedance</text><text class="s c" x="691" y="177">fields to circuit model</text><path class="arr" d="M778 142H800"/><rect class="box" x="804" y="90" width="166" height="104" rx="14"/><text class="h c" x="887" y="127">Hamiltonian</text><text class="t c" x="887" y="154">f, α, χ, g</text><text class="s c" x="887" y="177">compare with the target</text><path class="arr2" d="M883 198V262H103V198"/><text class="t c" x="493" y="288">adjust the geometry and repeat</text><rect class="pur" x="228" y="12" width="148" height="38" rx="19"/><text class="t c" x="302" y="37">GDS → fabrication</text><path class="arr2" d="M302 86V54"/></svg>
