<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="Energy participation ratios of the elements of one electromagnetic mode"><title>Energy participation ratios of the elements of one electromagnetic mode</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2430}
.h{font-size:19px;font-weight:600}.t{font-size:14.5px}.s{font-size:13px;fill:#586175}.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#f3f5fa;stroke:#c3cadb;stroke-width:1.5}
.acc{fill:#e6efff;stroke:#4589ff;stroke-width:2}
.pur{fill:#f0e9ff;stroke:#8a3ffc;stroke-width:2}
.ln{stroke:#586175;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.arr{stroke:#4589ff;stroke-width:2.6;fill:none;marker-end:url(#a)}
.arr2{stroke:#8a3ffc;stroke-width:2.2;fill:none;stroke-dasharray:6 5;marker-end:url(#b)}
.mk{fill:#4589ff}.mk2{fill:#8a3ffc}
.bar{fill:#4589ff}.bar2{fill:#8a3ffc}.bar3{fill:#0e9f8a}.track{fill:#e3e7f0}
.curve{stroke:#4589ff;stroke-width:2.4;fill:none}
.jj{fill:#f0e9ff;stroke:#8a3ffc;stroke-width:2}
@media (prefers-color-scheme:dark){
text{fill:#e4e6ea}.s{fill:#a2abbd}
.box{fill:#1c2028;stroke:#3b4252}.acc{fill:#18294a;stroke:#78a9ff}.pur{fill:#271a45;stroke:#be95ff}
.ln{stroke:#a2abbd}.arr{stroke:#78a9ff}.arr2{stroke:#be95ff}.mk{fill:#78a9ff}.mk2{fill:#be95ff}
.bar{fill:#78a9ff}.bar2{fill:#be95ff}.bar3{fill:#3ddbd9}.track{fill:#2a303c}.curve{stroke:#78a9ff}.jj{fill:#271a45;stroke:#be95ff}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk2" d="M0 0L10 5L0 10z"/></marker></defs><text class="h" x="20" y="34">Where the energy of one mode sits</text><text class="s" x="20" y="56">participation ratio p of each element; the p of all elements sum to one (illustrative values)</text><text class="t" x="20" y="105">Josephson junction</text><rect class="track" x="270" y="88" width="480" height="24" rx="12"/><rect class="bar2" x="270" y="88" width="422" height="24" rx="12"/><text class="t" x="764" y="105">0.88</text><text class="t" x="20" y="159">Substrate</text><rect class="track" x="270" y="142" width="480" height="24" rx="12"/><rect class="bar" x="270" y="142" width="34" height="24" rx="12"/><text class="t" x="764" y="159">0.07</text><text class="t" x="20" y="213">Metal–substrate interface</text><rect class="track" x="270" y="196" width="480" height="24" rx="12"/><rect class="bar3" x="270" y="196" width="14" height="24" rx="12"/><text class="t" x="764" y="213">0.03</text><text class="t" x="20" y="267">Seams, vacuum, other</text><rect class="track" x="270" y="250" width="480" height="24" rx="12"/><rect class="bar" x="270" y="250" width="14" height="24" rx="12"/><text class="t" x="764" y="267">0.02</text><text class="s" x="20" y="320">p of the junction sets the anharmonicity and cross-Kerr; p of lossy elements sets each loss channel</text></svg>
