<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="A transmon coupled through a capacitor to a resonator: lumped circuit model"><title>A transmon coupled through a capacitor to a resonator: lumped circuit model</title><style>
